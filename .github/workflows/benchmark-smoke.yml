name: Solver benchmark smoke
on:
  push:
    branches:
      - fix/nested-scaling-unlimited-benchmark-20261009
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check nested scenarios and paired inputs
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("benchmark", "notebooks/benchmark_solver_scaling.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          for seed in (1, 20261008, 20261009):
              previous = []
              for count in (5, 10, 15, 20, 30, 50, 75, 100):
                  items = m.generate_order(count, seed)["Items"]
                  assert items[:len(previous)] == previous
                  previous = items
          print("Nested input checks passed")
          PY
      - name: Run uncapped 5 and 10 item benchmark
        run: python notebooks/benchmark_solver_scaling.py --items 5,10 --boxes 3 --repeats 1 --output-dir benchmark_results/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-results
          path: benchmark_results/smoke/
