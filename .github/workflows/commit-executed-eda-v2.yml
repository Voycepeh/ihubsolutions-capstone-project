name: Commit executed EDA v2

on:
  push:
    paths:
      - '.eda_v2_chunks/READY'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib nbconvert jupyter
      - name: Execute v2 EDA notebook
        env:
          MPLBACKEND: Agg
        run: jupyter nbconvert --to notebook --execute --inplace "notebooks/Inital EDA v2.ipynb" --ExecutePreprocessor.timeout=180
      - name: Commit executed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "notebooks/Inital EDA v2.ipynb"
          git rm -r .eda_v2_chunks
          git rm .github/workflows/commit-executed-eda-v2.yml
          git commit -m "Commit executed v2 EDA outputs"
          git push
