name: Refresh solver benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - cleanup/solver-demo-readability-20261009
    paths:
      - .github/workflows/refresh-solver-benchmark.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/solver-demo-readability-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install solver dependencies
        run: pip install -r requirements.txt
      - name: Re-run all 2000 orders and replace historical CSV
        run: |
          python notebooks/benchmark_solver_modes.py \
            data/raw/data_samples_v2.json \
            --csv notebooks/artifacts/benchmark_2000_best_vs_ihub.csv
      - name: Verify refreshed results
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("notebooks/artifacts/benchmark_2000_best_vs_ihub.csv")
          with path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 2000, f"Expected 2000 orders, got {len(rows)}"
          assert len({r["order_id"] for r in rows}) == 2000, "Duplicate order IDs"
          print("Verified 2000 unique benchmark orders.")
          PY
      - name: Commit refreshed CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/artifacts/benchmark_2000_best_vs_ihub.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh 2000-order benchmark using current solver"
            git push
          fi
