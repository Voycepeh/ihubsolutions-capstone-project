name: Add Box9 diagnostic
on:
  push:
    paths:
      - '.github/workflows/add-box9-diagnostic.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: pip install nbformat nbconvert ipykernel pandas numpy matplotlib
      - name: Add Box9 offending-order diagnostic below section 7
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import nbformat

          nb_path = Path('notebooks/Inital EDA v2.ipynb')
          nb = nbformat.read(nb_path, as_version=4)

          # Remove any prior version of this diagnostic so the update is idempotent.
          nb.cells = [c for c in nb.cells if c.get('id') not in {'box9-question-heading','box9-question-table','box9-question-note'}]

          insert_at = None
          for i, cell in enumerate(nb.cells):
              if cell.cell_type == 'markdown' and cell.get('id') == 'util-gt6-insight':
                  insert_at = i + 1
                  break
          if insert_at is None:
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type == 'markdown' and '## 8.' in ''.join(cell.source):
                      insert_at = i
                      break
          if insert_at is None:
              raise RuntimeError('Could not locate insertion point after section 7')

          heading = nbformat.v4.new_markdown_cell(
              '### Box9 orders above the 70% threshold\n\n'
              'The table below lists **all Box9 cases where the reference output reports `UsedSpace > 70%`**. '
              'It includes the exact `OrderId`, the total physical item quantity in the order, the raw Box9 `UsedSpace` value, '
              'and the raw input `ItemsList` JSON from `data_samples_v2.json`. This is included so the cases can be sent to iHub for clarification.'
          )
          heading['id'] = 'box9-question-heading'

          code = nbformat.v4.new_code_cell(r'''box9_over_70 = []
for rec in raw:
    order_id = rec["input"]["OrderId"]
    raw_items = rec["input"]["Items"]["ItemsList"]
    physical_items = sum(item["Quantity"] for item in raw_items)
    for packed_bin in rec["output"]["Data"]["BinsPacked"]:
        if packed_bin["Code"] == "Box9" and float(packed_bin["UsedSpace"]) > 70:
            box9_over_70.append({
                "OrderId": order_id,
                "physical_items": physical_items,
                "Box9_UsedSpace_raw": packed_bin["UsedSpace"],
                "Raw_ItemsList": json.dumps(raw_items, ensure_ascii=False, separators=(",", ":")),
            })

box9_over_70_df = pd.DataFrame(box9_over_70).sort_values(["Box9_UsedSpace_raw", "OrderId"], ascending=[False, True]).reset_index(drop=True)
print(f"Box9 orders above 70%: {len(box9_over_70_df):,} unique orders")
display(box9_over_70_df)''')
          code['id'] = 'box9-question-table'

          note = nbformat.v4.new_markdown_cell(
              '**Question for iHub.** The supplied v2 parameters indicate a 70% maximum fill check once the item-count threshold is exceeded, '
              'yet these Box9 reference outputs are above 70%. Is Box9 intentionally exempt from `BinMaxFillPct`, or is there additional Box9-specific '
              'logic in the current service that is not represented in the supplied request parameters?'
          )
          note['id'] = 'box9-question-note'

          nb.cells[insert_at:insert_at] = [heading, code, note]
          nbformat.write(nb, nb_path)
          PY
      - name: Execute updated notebook
        run: |
          cd notebooks
          jupyter nbconvert --to notebook --execute 'Inital EDA v2.ipynb' --output 'Inital EDA v2.ipynb' --ExecutePreprocessor.timeout=180
      - name: Commit notebook and clean temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-box9-diagnostic.yml
          git add 'notebooks/Inital EDA v2.ipynb' .github/workflows/add-box9-diagnostic.yml
          git commit -m 'Add Box9 overfill diagnostic to EDA v2'
          git push
