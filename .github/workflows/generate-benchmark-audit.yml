name: Execute benchmark audit notebook

on:
  push:
    branches:
      - feature/full-benchmark-audit

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-benchmark-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt nbconvert ipykernel
      - name: Execute audit viewer
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=300 "notebooks/Best vs iHub Audit.ipynb"
      - name: Preserve rendered notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "notebooks/Best vs iHub Audit.ipynb"
          git diff --cached --quiet || git commit -m "Execute Best vs iHub audit notebook"
          git push
