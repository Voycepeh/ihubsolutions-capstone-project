name: Fast heuristic A/B benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/bin_packing_3d/**'
      - '.github/workflows/fast-ab-benchmark.yml'
  workflow_dispatch:

jobs:
  compare-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare main and proposed Fast using identical seeded cases
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/ihub-main origin/main
          python - <<'PY'
          import importlib.util
          import json
          import subprocess
          import sys
          from pathlib import Path

          cases = [(n, 20, 20261008 + repeat) for n in (50, 75, 100) for repeat in range(3)]
          runner = r'''
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          sys.path.insert(0, str(root / "src"))
          sys.path.insert(0, str(root / "notebooks"))
          from benchmark_solver_scaling import generate_boxes, generate_order
          from bin_packing_3d import solve_order
          items, box_count, seed = map(int, sys.argv[2:5])
          result = solve_order(generate_order(items, seed), generate_boxes(box_count), mode="fast", max_runtime_ms=None)
          print(json.dumps({"items": items, "box_types": box_count, "seed": seed, "cartons": result.metrics.box_count, "runtime_ms": round(result.runtime_ms, 2), "valid": result.validation.valid, "status": result.status}))
          '''
          current = Path.cwd()
          baseline = Path("/tmp/ihub-main")
          print("items,seed,baseline_cartons,proposed_cartons,baseline_ms,proposed_ms,baseline_valid,proposed_valid", flush=True)
          for n, box_count, seed in cases:
              values = []
              for root in (baseline, current):
                  completed = subprocess.run([sys.executable, "-c", runner, str(root), str(n), str(box_count), str(seed)], capture_output=True, text=True, check=True)
                  values.append(json.loads(completed.stdout.strip().splitlines()[-1]))
              a, b = values
              print(f'{n},{seed},{a["cartons"]},{b["cartons"]},{a["runtime_ms"]},{b["runtime_ms"]},{a["valid"]},{b["valid"]}', flush=True)
              if not a["valid"] or not b["valid"]:
                  raise SystemExit("Packing validation failed")
          PY
