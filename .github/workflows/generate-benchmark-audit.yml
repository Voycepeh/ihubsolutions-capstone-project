name: Generate benchmark audit

on:
  push:
    branches:
      - feature/full-benchmark-audit
  pull_request:
    branches:
      - cleanup/solver-demo-canonical-rules
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-benchmark-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run all 2,000 orders
        run: |
          python notebooks/benchmark_solver_modes.py \
            data/raw/data_samples_v2.json \
            --csv notebooks/artifacts/benchmark_2000_best_vs_ihub.csv
      - name: Preserve benchmark CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/artifacts/benchmark_2000_best_vs_ihub.csv
          git diff --cached --quiet || git commit -m "Generate 2,000-order benchmark audit"
          git push
