name: Refresh solver scaling benchmark

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Number of repetitions per scenario
        required: true
        default: '3'

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run current-strategy scaling benchmark
        run: |
          python notebooks/benchmark_solver_scaling.py \
            --items 5,10,15,20,30,50,75,100 \
            --boxes 3,5,10,15,20 \
            --repeats "${{ inputs.repeats }}" \
            --seed 20261008 \
            --output-dir benchmark_results/solver_scaling_refresh
      - name: Upload raw measurements and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-scaling-greedy-fast
          path: benchmark_results/solver_scaling_refresh/
          if-no-files-found: warn
      - name: Validate and prepare README refresh
        run: |
          python notebooks/publish_solver_scaling.py \
            --source benchmark_results/solver_scaling_refresh \
            --destination benchmark_results/solver_scaling_current \
            --repeats "${{ inputs.repeats }}"
      - name: Propose refreshed benchmark results
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: refresh solver scaling measurements and conclusion"
          branch: automation/solver-scaling-results
          delete-branch: true
          title: "Refresh solver scaling charts and README conclusion"
          body: |
            Generated from the completed scaling benchmark.
            Only scaling CSVs, existing SVG charts, and the execution-time conclusion are refreshed.
            Review measurements and chart diffs before merging.
          add-paths: |
            benchmark_results/solver_scaling_current/raw_results.csv
            benchmark_results/solver_scaling_current/summary.csv
            benchmark_results/solver_scaling_current/solver_scaling_fast_heatmap.svg
            benchmark_results/solver_scaling_current/solver_scaling_best_heatmap.svg
            benchmark_results/solver_scaling_current/solver_scaling_best_breakdown.svg
            README.md
