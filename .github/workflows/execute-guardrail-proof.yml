name: Execute guardrail proof
on:
  push:
    branches: [demo/simulated-rule-proof]
permissions:
  contents: write
jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/simulated-rule-proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt nbconvert ipykernel
      - run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=120 "notebooks/Simulated Rule Proof.ipynb"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "notebooks/Simulated Rule Proof.ipynb"
          git diff --cached --quiet || git commit -m "Execute guardrail proof notebook"
          git push
