name: Refresh Solver Demo Benchmark

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    concurrency:
      group: solver-demo-benchmark-publish
      cancel-in-progress: false
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solver dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute notebook to refresh benchmark and saved outputs
        env:
          REFRESH_SOLVER_BENCHMARK: '1'
        run: |
          python -m pip install numpy matplotlib nbconvert nbclient ipykernel pandas
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("notebooks/Solver Demo.ipynb")
          notebook = nbformat.read(path, as_version=4)
          client = NotebookClient(notebook, timeout=2400, kernel_name="python3", resources={"metadata": {"path": str(Path.cwd() / "notebooks")}})
          client.execute()
          nbformat.write(notebook, path)
          print("Saved refreshed benchmark and executed notebook:", path)
          PY
      - name: Generate both comparison charts and README from notebook benchmark
        run: |
          python notebooks/plot_solver_demo_comparison.py notebooks/artifacts/benchmark_2000_best_vs_ihub.csv benchmark_results/solver_demo/fast_best_ihub_comparison.svg
          python notebooks/update_benchmark_readme.py
      - name: Verify all report sources reconcile
        run: python -m pytest tests/test_benchmark_comparison.py -q
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-solver-demo-benchmark
          path: |
            notebooks/artifacts/benchmark_2000_best_vs_ihub.csv
            benchmark_results/solver_demo/fast_best_ihub_comparison.svg
            benchmark_results/solver_demo/fast_best_ihub_tornado.svg
            README.md
            notebooks/Solver Demo.ipynb
      - name: Commit refreshed benchmark to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/artifacts/benchmark_2000_best_vs_ihub.csv benchmark_results/solver_demo/fast_best_ihub_comparison.svg benchmark_results/solver_demo/fast_best_ihub_tornado.svg README.md 'notebooks/Solver Demo.ipynb'
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate 2000-order Fast vs Best benchmark"
            git fetch origin "${{ github.ref_name }}"
            git rebase -X theirs "origin/${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
