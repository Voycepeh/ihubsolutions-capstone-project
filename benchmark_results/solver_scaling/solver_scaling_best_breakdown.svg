<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-label="Stacked chart comparing Fast runtime and estimated additional Best runtime across all eight item counts"><rect width="940" height="650" fill="#fff"/><text x="38" y="43" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#17324b">Fast baseline + additional Best runtime</text><text x="38" y="67" font-family="Arial,sans-serif" font-size="14" fill="#526878">20 available box types · median seconds across 3 runs · all 8 item counts</text><rect x="140" y="87" width="16" height="16" rx="2" fill="#147d91"/><text x="164" y="100" font-family="Arial" font-size="14" fill="#17324b">Fast baseline</text><rect x="320" y="87" width="16" height="16" rx="2" fill="#eda65a"/><text x="344" y="100" font-family="Arial" font-size="14" fill="#17324b">Estimated additional Best time</text><text x="99" y="150" text-anchor="end" font-family="Arial" font-size="15" fill="#17324b">5 items</text><rect x="125" y="125" width="0.01" height="32" fill="#147d91"/><rect x="125.01" y="125" width="0.09" height="32" fill="#eda65a"/><text x="135.10" y="147" font-family="Arial" font-size="14" fill="#17324b">0.02 s</text><text x="99" y="206" text-anchor="end" font-family="Arial" font-size="15" fill="#17324b">10 items</text><rect x="125" y="181" width="0.36" height="32" fill="#147d91"/><rect x="125.36" y="181" width="0.33" height="32" fill="#eda65a"/><text x="135.69" y="203" font-family="Arial" font-size="14" fill="#17324b">0.11 s</text><text x="99" y="262" text-anchor="end" font-family="Arial" font-size="15" fill="#17324b">15 items</text><rect x="125" y="237" width="0.79" height="32" fill="#147d91"/><rect x="125.79" y="237" width="0.73" height="32" fill="#eda65a"/><text x="136.52" y="259" font-family="Arial" font-size="14" fill="#17324b">0.25 s</text><text x="99" y="318" text-anchor="end" font-family="Arial" font-size="15" fill="#17324b">20 items</text><rect x="125" y="293" width="1.15" height="32" fill="#147d91"/><rect x="126.15" y="293" width="1.23" height="32" fill="#eda65a"/><text x="137.38" y="315" font-family="Arial" font-size="14" fill="#17324b">0.39 s</text><text x="99" y="374" text-anchor="end" font-family="Arial" font-size="15" fill="#17324b">30 items</text><rect x="125" y="349" width="1.87" height="32" fill="#147d91"/><rect x="126.87" y="349" width="2.74" height="32" fill="#eda65a"/><text x="139.62" y="371" font-family="Arial" font-size="14" fill="#17324b">0.75 s</text><text x="99" y="430" text-anchor="end" font-family="Arial" font-size="15" fill="#17324b">50 items</text><rect x="125" y="405" width="78.01" height="32" fill="#147d91"/><rect x="203.01" y="405" width="0.60" height="32" fill="#eda65a"/><text x="213.61" y="427" font-family="Arial" font-size="14" fill="#17324b">12.78 s</text><text x="99" y="486" text-anchor="end" font-family="Arial" font-size="15" fill="#17324b">75 items</text><rect x="125" y="461" width="30.63" height="32" fill="#147d91"/><rect x="155.63" y="461" width="5.82" height="32" fill="#eda65a"/><text x="171.46" y="483" font-family="Arial" font-size="14" fill="#17324b">5.93 s</text><text x="99" y="542" text-anchor="end" font-family="Arial" font-size="15" fill="#17324b">100 items</text><rect x="125" y="517" width="455.19" height="32" fill="#147d91"/><rect x="580.19" y="517" width="8.32" height="32" fill="#eda65a"/><text x="598.51" y="539" font-family="Arial" font-size="14" fill="#17324b">75.37 s</text><text x="38" y="601" font-family="Arial" font-size="13" fill="#526878">Total bar length = Best median runtime. Extra segment = Best median − Fast median.</text><text x="38" y="622" font-family="Arial" font-size="12" fill="#526878">Estimated from separate runs; not a direct measurement of internal Best phases.</text></svg>