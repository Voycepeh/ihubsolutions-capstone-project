name: Update EDA v2 benchmark notes

on:
  push:
    paths:
      - '.github/workflows/update-eda-v2-benchmark-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update benchmark interpretation in sections 9 and 10
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('notebooks/Inital EDA v2.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))

          for cell in nb['cells']:
              if cell.get('cell_type') != 'markdown':
                  continue
              text = ''.join(cell.get('source', []))

              if text.startswith('**Benchmark interpretation.**'):
                  cell['source'] = [
                      '**Benchmark interpretation.** The median and p95 values above are the most useful reference-service timings for comparing our solver. Each `latency_ms` value represents one complete order request, not one item line. The supplied dataset does not tell us whether this timing includes service overhead, but it should be treated as an already-running service processing a full order. For our Python implementation, the fair comparison is therefore the **warm per-order `solve_order()` execution time**, with the Python process already started and imports/configuration already loaded. **Cold-start time** such as launching Python, importing packages and loading configuration should be measured separately and must not be mixed into the solver-runtime benchmark. This distinction matters because the production pattern is batch-style order processing through a running application, not starting a new Python process for every order.'
                  ]

              if text.startswith('## 10. Initial takeaways for solver design'):
                  # Keep the heading cell itself unchanged.
                  continue

          # Add a performance takeaway to the section 10 markdown cell that contains the numbered takeaways.
          section10 = False
          for cell in nb['cells']:
              if cell.get('cell_type') != 'markdown':
                  continue
              text = ''.join(cell.get('source', []))
              if text.startswith('## 10. Initial takeaways for solver design'):
                  section10 = True
                  continue
              if section10 and text.startswith('## '):
                  section10 = False
              if section10 and ('Single-carton feasibility' in text or text.lstrip().startswith('1.')):
                  if 'Warm per-order latency is the benchmark' not in text:
                      text = text.rstrip() + '\n\n5. **Warm per-order latency is the benchmark.** The reference timings are for complete order processing by an already-running service. Our solver should therefore benchmark the execution time of `solve_order()` after Python and its dependencies are loaded, using median and p95 latency for comparison. Python startup, imports and configuration loading are separate cold-start costs and should be reported independently. The practical target is fast, valid batch processing of complete orders, not launching a fresh Python process for every order.\n'
                      cell['source'] = [text]
                  break

          path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit notebook and remove temporary workflow
        run: |
          rm .github/workflows/update-eda-v2-benchmark-notes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'notebooks/Inital EDA v2.ipynb' .github/workflows/update-eda-v2-benchmark-notes.yml
          git commit -m 'Clarify warm solver benchmark in EDA v2'
          git push
