name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Verify nested benchmark inputs
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('benchmark', 'notebooks/benchmark_solver_scaling.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for seed in (1, 20261008, 20261009):
              previous = []
              for count in (5, 10, 15, 20, 30, 50, 75, 100):
                  items = module.generate_order(count, seed)['Items']
                  assert items[:len(previous)] == previous
                  previous = items
          print('Nested input scenarios passed')
          PY

      - name: Run uncapped small solver benchmark
        timeout-minutes: 8
        run: python notebooks/benchmark_solver_scaling.py --items 5,10 --boxes 3 --repeats 1 --output-dir benchmark_results/smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-results
          path: benchmark_results/smoke/

  full-scaling-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run complete uncapped solver scaling grid
        run: python -u notebooks/benchmark_solver_scaling.py --output-dir benchmark_results/full
      - name: Upload completed benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-full-results
          path: benchmark_results/full/
          if-no-files-found: warn
